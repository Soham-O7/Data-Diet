[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dataprune"
version = "0.1.0"
description = "Energy-aware dataset pruning: hash, SemDeDup, confident learning, difficulty scoring, CCS/D2, class quotas, proof run."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "pillow>=10",
]

[project.optional-dependencies]
bench = ["matplotlib>=3.8"]
test = ["pytest>=8"]
dinov2 = ["torch"]
energy = ["codecarbon"]
parquet = ["pyarrow"]
cleanlab = ["cleanlab"]

[project.scripts]
dataprune = "dataprune.cli:main"

[tool.setuptools]
packages = ["dataprune"]

[tool.pytest.ini_options]
testpaths = ["tests"]
